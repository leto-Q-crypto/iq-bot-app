name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: npm ci || npm install

      - name: Prepare www
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          test -s www/index.html

      - run: npx cap add android

      - name: Copy configs
        run: |
          set -e
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp config/accessibility_service_config.xml android/app/src/main/res/xml/
          mkdir -p android/app/src/main/res/values
          cp config/values/strings.xml android/app/src/main/res/values/
          mkdir -p android/app/src/main/java/com/iqtest/app
          cp config/MyAccessibilityService.java android/app/src/main/java/com/iqtest/app/
          cp config/SmsReceiver.java android/app/src/main/java/com/iqtest/app/

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: IQ-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
