name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web files
        shell: bash
        run: |
          set -e
          rm -rf www
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "iq-test.html" ]; then
            cp iq-test.html www/index.html
          else
            echo "ERROR: no html found"
            exit 1
          fi
          test -s www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Copy custom files
        shell: bash
        run: |
          set -e
          if [ -f "config/AndroidManifest.xml" ]; then
            cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          mkdir -p android/app/src/main/res/xml
          if [ -f "config/accessibility_service_config.xml" ]; then
            cp config/accessibility_service_config.xml android/app/src/main/res/xml/
          fi
          mkdir -p android/app/src/main/java/com/iqtest/app
          for file in MainActivity.java MyAccessibilityService.java SmsReceiver.java; do
            if [ -f "config/$file" ]; then
              cp "config/$file" android/app/src/main/java/com/iqtest/app/
            fi
          done

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: IQ-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
