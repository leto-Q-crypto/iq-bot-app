name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then cp index.html www/index.html; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Copy config files
        run: |
          if [ -f "config/AndroidManifest.xml" ]; then
            cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          mkdir -p android/app/src/main/res/xml
          if [ -f "config/accessibility_service_config.xml" ]; then
            cp config/accessibility_service_config.xml android/app/src/main/res/xml/
          fi
          mkdir -p android/app/src/main/java/com/iqtest/app
          if [ -f "config/MyAccessibilityService.java" ]; then
            cp config/MyAccessibilityService.java android/app/src/main/java/com/iqtest/app/
          fi
          if [ -f "config/SmsReceiver.java" ]; then
            cp config/SmsReceiver.java android/app/src/main/java/com/iqtest/app/
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/IQ-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Test-APK
          path: output/IQ-Test.apk
